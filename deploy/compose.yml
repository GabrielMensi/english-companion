# Run from this folder on the server: `TAG=v1.0.0 docker compose up -d`. See docs/platform/DEPLOY.md.
services:
  app:
    image: ${IMAGE:-ghcr.io/gabrielmensi/english-companion}:${TAG:?set TAG, e.g. v1.0.0}
    restart: unless-stopped
    env_file: .env.production # chmod 600, outside git
    volumes:
      - ./data:/data
    # Not published to the host: only Caddy reaches it, which is what makes TRUST_PROXY safe.
    expose: ["3737"]
    networks: [web]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
    networks: [web]
networks:
  web:
volumes:
  caddy_data:
