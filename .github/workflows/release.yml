name: Release

# Publishes a GitHub Release when an annotated v* tag is pushed (rules: docs/platform/RELEASES.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches and tags, to check where the tag points
          persist-credentials: false

      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease"; exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "::error::Tag '$TAG' is lightweight. Create it with: git tag -a $TAG -m \"...\""; exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json version is $version but the tag is $TAG"; exit 1
          fi
          if printf '%s' "$TAG" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            # A stable release is always a commit of main.
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG is not on main. Merge develop into main first, then tag."; exit 1
            fi
          fi

  checks:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"
