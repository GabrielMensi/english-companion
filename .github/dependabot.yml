# target-branch only applies to version updates: Dependabot security updates open against main,
# so retarget those PRs to develop.
version: 2
updates:
  - package-ecosystem: npm # pnpm-lock.yaml is supported by the npm ecosystem
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
